name: build

# Why this exists: the toolchain depends on a Chrome build, poppler, Node 22
# and python-pptx. A change to any of them breaks the export, and without this
# the first person to find out is whoever is exporting at midnight before a
# hand-in. That is not hypothetical here: a routine Playwright upgrade once
# moved chromium-1223 to chromium-1234 and the whole thing stopped with "No
# such file or directory", which gives no hint that Chrome is the missing part.
#
# It also answers the second open question, whether the committed PDFs still
# match their sources. See the staleness step for why that compares text
# rather than bytes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # the extractor uses the built-in WebSocket

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poppler and the Calibri-metric font
        run: |
          sudo apt-get update -qq
          # fonts-crosextra-carlito is only for docs/_default-powerpoint.html,
          # the before-and-after picture. Without it that one slide falls back
          # to Liberation Sans and the comparison stops matching real Office.
          sudo apt-get install -y -qq poppler-utils fonts-crosextra-carlito

      - run: pip install -r tools/requirements.txt

      - name: Keep the committed outputs, so we can tell if they went stale
        run: |
          mkdir -p /tmp/committed
          # Key by the full path, not the basename. slides/slides.pdf and
          # examples/auditcert-france-2026/slides.pdf share a basename, so
          # keying by it made the example overwrite the deck and the next step
          # compared a 6-page deck against a 14-page example.
          for f in slides/slides.pdf slides/gallery.pdf paper/paper.pdf \
                   paper/onepager.pdf examples/auditcert-france-2026/slides.pdf \
                   slides/slides.pptx examples/auditcert-france-2026/slides.pptx; do
            [ -f "$f" ] && cp "$f" "/tmp/committed/${f//\//__}"
          done
          : # never let a missing last file end this step under bash -e

      - name: Build everything
        run: ./build.sh

      - name: Are the committed PDFs still current?
        run: |
          # Byte comparison does not work: every PDF carries a /ID that Chrome
          # regenerates on each run, so identical documents differ by a few
          # bytes. `pdftotext -layout` does not work either, and this run
          # proved it: the committed gallery.pdf differed from a CI rebuild by
          # exactly one blank line, at the same page count and the same words,
          # because sub-pixel layout differs between Chrome builds.
          #
          # So compare what going stale would actually change: the page count,
          # and the sequence of words with all whitespace collapsed.
          words () { pdftotext "$1" - | tr -s '[:space:]' ' '; }
          stale=0
          for f in slides/slides.pdf slides/gallery.pdf paper/paper.pdf \
                   paper/onepager.pdf examples/auditcert-france-2026/slides.pdf; do
            old="/tmp/committed/${f//\//__}"
            [ -f "$old" ] || continue
            po=$(pdfinfo "$old" | awk '/Pages/{print $2}')
            pn=$(pdfinfo "$f"   | awk '/Pages/{print $2}')
            if [ "$po" != "$pn" ] || ! diff -q <(words "$old") <(words "$f") >/dev/null; then
              echo "::warning file=$f::$f is committed stale: rebuild and commit it"
              echo "--- pages: committed $po, built $pn ---"
              diff <(words "$old" | tr ' ' '\n') <(words "$f" | tr ' ' '\n') | head -24
              stale=$((stale+1))
            fi
          done
          # The editable .pptx is the headline deliverable, and nothing was
          # checking it. A deck edit committed without it leaves the PowerPoint
          # contradicting the PDF beside it. Compare the text runs, since the
          # zip bytes differ on every build.
          pptx_text () { unzip -p "$1" 'ppt/slides/slide*.xml' | grep -o '<a:t>[^<]*' | sort; }
          for f in slides/slides.pptx examples/auditcert-france-2026/slides.pptx; do
            old="/tmp/committed/${f//\//__}"
            [ -f "$old" ] || continue
            if ! diff -q <(pptx_text "$old") <(pptx_text "$f") >/dev/null; then
              echo "::warning file=$f::$f is committed stale: rebuild and commit it"
              diff <(pptx_text "$old") <(pptx_text "$f") | head -12
              stale=$((stale+1))
            fi
          done

          if [ "$stale" -gt 0 ]; then
            echo "$stale committed PDF(s) no longer match their source."
            echo "Run ./build.sh and commit the result."
            exit 1
          fi
          echo "Every committed PDF matches its source."

      - name: Are the README pictures still current?
        run: python3 tools/check_images.py docs/img

      - uses: actions/upload-artifact@v4
        if: always()          # a failed build is exactly when you want the output
        with:
          name: deliverables
          path: |
            slides/slides.pdf
            slides/slides.pptx
            slides/slides-pictures.pptx
            slides/gallery.pdf
            paper/paper.pdf
            paper/onepager.pdf
          retention-days: 30
